[project]
name = "mdict-audio-extractor"
version = "0.4.2"
description = "Extract UK/US headword audio from MDict and synthesize wordlist example audio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "edge-tts==7.2.8",
    "mdict-utils==1.3.14",
    "xxhash>=3.4.1",
]

[project.scripts]
mdict-audio-extractor = "mdict_audio_extractor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdict_audio_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
